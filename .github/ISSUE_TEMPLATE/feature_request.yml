name: Feature request
description: Propose a focused, useful improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the workflow and expected benefit without assuming that lower RAM use means faster work.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives, resource costs and preservation of active work
