name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository boundaries
        run: .\scripts\check-repository.ps1
      - name: Build application and installer
        run: .\package.ps1
      - name: Check WPF control layout and direct Boost wiring
        run: .\test-ui.ps1
      - name: Check release selection and verified download guards
        run: .\test-updates.ps1
      - name: Check live-scan orchestration with isolated fixtures
        run: .\test-care.ps1
      - name: Check isolated installer lifecycle
        run: .\test-installer.ps1
      - name: Retain unsigned build and test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietcare-windows-${{ github.sha }}
          path: |
            build/QuietCare.exe
            build/QuietCare-Setup.exe
            build/ui-test-results.txt
            build/installer-test-results.txt
            build/update-test-results.txt
            build/care-test-results.txt
          if-no-files-found: warn
          retention-days: 14
